name: sinoar
description: "سَنوار - المساعد الذكي الشخصي المتقدم للهاتف"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Icons & Modern UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # AI & Network
  google_generative_ai: ^0.4.6
  http: ^1.2.0

  # Storage & Secure Memory
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Audio & Permissions
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
